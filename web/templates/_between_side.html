{# the side panel both Between claimants pages share (ticket 44): what is shown, and the five years #}
      <div class="bc-head">
        <p class="kicker bc-kicker">Between claimants</p>
        <div class="bc-pick">
          <label><span class="sr-only">First claimant</span>
            <select id="bc-first" aria-label="First claimant">
              <option value="ALL">All claimants</option>
              {% for c in claimants %}<option value="{{ c.code }}"{% if pair and pair.a == c.code %} selected{% endif %}>{{ c.name }}</option>{% endfor %}
            </select></label>
          <button type="button" class="bc-swap" id="bc-swap" aria-label="Swap the two claimants" title="Swap the two claimants">⇄</button>
          <label><span class="sr-only">Second claimant</span>
            <select id="bc-second" aria-label="Second claimant">
              <option value="ALL">all others</option>
              {% for c in claimants %}<option value="{{ c.code }}"{% if pair and pair.b == c.code %} selected{% endif %}>{{ c.name }}</option>{% endfor %}
            </select></label>
        </div>
      </div>
      <fieldset class="bc-group bc-time"><legend id="bc-time-legend">Five years to</legend>
        <div class="bc-time-row"><output class="bc-when" id="bc-label" for="bc-year"></output>
          <button type="button" class="bc-play" id="bc-play" aria-pressed="false" aria-label="Play through the years">▶</button></div>
        <div class="bc-spark" id="bc-spark" aria-hidden="true"></div>
        <label class="bc-slider"><span class="sr-only">Last year of the five</span><input type="range" id="bc-year" min="0" max="0" step="1" value="0"></label>
        <label class="bc-check"><input type="checkbox" id="bc-all"><span>Build-up since {{ meta.first_year }}</span></label>
      </fieldset>
