name: validate

# Two depths (2026-11-25). A pull request that changes only data the maintainer decided (the five tables,
# the harvest and review archives, review pages and notes) gets the light check: the validator, the
# MATS reproducibility check, the tests that read the data, and a site build (which also builds the agreement page), in about five minutes.
# Anything else (code, the site, tests, the reference data, the raw inputs) and every push to main get
# the full suite, browser tests included (about twenty minutes).

on:
  pull_request:
  push:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - name: Scope (light for a data-only pull request)
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            changed=$(git diff --name-only "$BASE"...HEAD)
            echo "$changed"
            other=$(echo "$changed" | grep -Ev '^(data/(events|moves|sources|corrections|claimants)\.csv|harvest/(airtable|audit|manual|presort)/|docs/(review|notes)/)' || true)
            if [ -n "$changed" ] && [ -z "$other" ]; then echo "LIGHT=1" >> "$GITHUB_ENV"; echo "light check: data only"; else echo "full suite"; fi
          fi
      - name: Install a browser for the site render tests
        if: env.LIGHT != '1'
        run: python -m playwright install --with-deps chromium
      - name: Tests at the three seams
        if: env.LIGHT != '1'
        run: python -m pytest
      - name: Tests that read the data (light check)
        if: env.LIGHT == '1'
        run: >-
          python -m pytest -q tests/test_validate.py tests/test_places.py tests/test_tally.py
          tests/test_window_scores.py tests/test_load_mats.py
          tests/test_baselines.py tests/test_gazetteer.py
      - name: The site builds (light check)
        if: env.LIGHT == '1'
        run: python -m web.build --out /tmp/site
      - name: Validate canonical files
        run: python -m pipeline.validate
      - name: MATS-era rows are reproducible from the raw inputs
        # project-coded moves and harvested events are not the loader's; a review branch must pass too
        run: |
          python -m pipeline.load_mats --check data
          python -m pipeline.load_mats --out /tmp/regen --diff-log /tmp/regen-diff.md
          diff -q docs/reports/mats-1.02-vs-mavd-differences.md /tmp/regen-diff.md
