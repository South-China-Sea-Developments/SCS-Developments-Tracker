name: validate

on:
  pull_request:
  push:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - name: Install a browser for the site render tests
        run: python -m playwright install --with-deps chromium
      - name: Tests at the three seams
        run: python -m pytest
      - name: Validate canonical files
        run: python -m pipeline.validate
      - name: MATS-era rows are reproducible from the raw inputs
        # project-coded moves and harvested events are not the loader's; a review branch must pass too
        run: |
          python -m pipeline.load_mats --check data
          python -m pipeline.load_mats --out /tmp/regen --diff-log /tmp/regen-diff.md
          diff -q docs/reports/mats-1.02-vs-mavd-differences.md /tmp/regen-diff.md
