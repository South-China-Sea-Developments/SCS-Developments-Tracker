name: harvest

# The harvest run (ticket 07). On demand: restore the harvest state, fetch the
# active sources, extract candidate events with the language model, open the review pull request,
# save the state, remind the maintainer of review pull requests older than seven days. A failed run
# opens one issue (further failures comment on it; the next success closes it).
#
# Who answers the extraction prompts (ticket 14), decided by which secret exists:
#   api           ANTHROPIC_API_KEY: the pipeline calls the API itself (`harvest run`).
#   subscription  CLAUDE_CODE_OAUTH_TOKEN (from `claude setup-token`): the pipeline writes the prompts as
#                 files, the Claude Code GitHub Action answers them with the /harvest-extract skill on the
#                 maintainer's subscription, the pipeline reads the answers (`harvest prompts` / `extract`).
#                 A relevance filter and max_documents keep the weekly cost small; documents over the cap
#                 are fetched again next run.
#   none          neither: the run fetches, opens or updates one "waiting for extraction" issue (with the
#                 session route spelled out) and leaves the state untouched, so nothing is lost.
# Nothing reads either secret except the step that extracts.
#
# Dry run (workflow_dispatch with dry_run = true): fetches the live sources, but extracts the fixture
# captures with the recorded responses; `queue open` stops before the push (branch and commit only);
# the state is not saved; the issue and reminder steps read GitHub but print their writes instead
# of making them. No extractor budget is spent. What a dry run does not exercise: the branch push,
# the pull request creation and the state push (the token's write side); the first real run shows those.
#
# Tokens: GITHUB_TOKEN can open the pull request, but a pull request it opens does not trigger the
# validate workflow until a person pushes to it. Add a fine-grained HARVEST_TOKEN secret (contents
# and pull requests: write) to have the validator run on the review pull request from the start.

# Since 2026-10-26 (decision 08, amended) the weekly run is a scheduled task on the maintainer's Claude
# subscription that performs the same steps in a session (README, "Extraction without an API key"); this
# workflow is run on demand, for the api and subscription-token routes and for dry runs.
on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run: live fetch, recorded extractor, no pull request, no state, no posts"
        type: boolean
        default: false
      since:
        description: "Only items published on or after this date (YYYY-MM-DD); empty = everything new"
        default: ""
      only:
        description: "Comma-separated source ids to restrict the run (empty = all active)"
        default: ""
      model:
        description: "Extractor model"
        default: "claude-sonnet-5-5"
      max_documents:
        description: "Prompts per run on the subscription route; the rest are deferred to the next run (0 = all)"
        default: "80"

permissions:
  contents: write
  pull-requests: write
  issues: write

concurrency:
  group: harvest
  cancel-in-progress: false

env:
  MAINTAINER: Angelo-M-SCS
  DRY_RUN: ${{ inputs.dry_run == true && '1' || '' }}
  SINCE: ${{ inputs.since }}
  ONLY: ${{ inputs.only }}
  MODEL: ${{ inputs.model || 'claude-sonnet-5-5' }}
  MAX_DOCUMENTS: ${{ inputs.max_documents || '80' }}
  # dry | api | subscription | none (see the header)
  ROUTE: ${{ inputs.dry_run == true && 'dry' || secrets.ANTHROPIC_API_KEY != '' && 'api' || secrets.CLAUDE_CODE_OAUTH_TOKEN != '' && 'subscription' || 'none' }}
  GH_TOKEN: ${{ secrets.HARVEST_TOKEN || secrets.GITHUB_TOKEN }}

jobs:
  harvest:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.HARVEST_TOKEN || github.token }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[llm]"
      - name: Run id and git identity
        run: |
          echo "RUN_ID=$(date -u +%Y%m%dT%H%M)" >> "$GITHUB_ENV"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
      - name: Restore harvest state
        run: python -m pipeline.ops state pull
      - name: Probe sources
        run: python -m pipeline.harvest probe || true
      - name: Route
        run: echo "extraction route $ROUTE, model $MODEL, max documents $MAX_DOCUMENTS"
      - name: Fetch and extract (API)
        if: env.ROUTE == 'api'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          python -m pipeline.harvest run --run-id "$RUN_ID" --since "$SINCE" --only "$ONLY" \
            --model "$MODEL" --record --recordings "harvest/recordings/$RUN_ID"
      - name: Fetch and extract (dry run, recorded extractor, through the prompt files)
        if: env.ROUTE == 'dry'
        run: |
          python -m pipeline.harvest fetch --out "harvest/captures/$RUN_ID" --since "$SINCE" --only "$ONLY" --state harvest/state.json
          python -m pipeline.harvest prompts --captures tests/fixtures/harvest/captures --out "harvest/prompts/$RUN_ID" --all
          python -m pipeline.harvest extract --captures tests/fixtures/harvest/captures --out "harvest/runs/$RUN_ID" \
            --prompts "harvest/prompts/$RUN_ID" --recordings tests/fixtures/harvest/recordings --run-id "$RUN_ID"
      - name: Fetch and write the prompts
        if: env.ROUTE == 'subscription' || env.ROUTE == 'none'
        run: |
          python -m pipeline.harvest fetch --out "harvest/captures/$RUN_ID" --since "$SINCE" --only "$ONLY" --state harvest/state.json
          python -m pipeline.harvest prompts --captures "harvest/captures/$RUN_ID" --out "harvest/prompts/$RUN_ID" \
            --max-documents "$MAX_DOCUMENTS" --answered-by "claude-code/$MODEL"
          echo "PROMPTS=$(python -c "import json; print(len(json.load(open('harvest/prompts/$RUN_ID/index.json'))['documents']))")" >> "$GITHUB_ENV"
      - name: Answer the prompts on the maintainer's subscription
        if: env.ROUTE == 'subscription' && env.PROMPTS != '0'
        # A prompt the action leaves unanswered is a failure in run.json and is fetched again next run,
        # so the action's own outcome does not decide the job's; the extract step does. The agent gets
        # the skill's tools only: it can read the prompts and write answer files, nothing else.
        continue-on-error: true
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          prompt: "/harvest-extract ${{ env.RUN_ID }} claude-code/${{ env.MODEL }}"
          claude_args: "--model ${{ env.MODEL }} --max-turns 400 --allowedTools Read,Write,Glob,Agent --disallowedTools Bash"
      - name: Check that the agent touched nothing but the answers
        if: env.ROUTE == 'subscription'
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            echo "the working tree changed outside harvest/recordings/ during the answer step:"; git status --porcelain; exit 1
          fi
      - name: Extract from the answers
        if: env.ROUTE == 'subscription'
        run: |
          python -m pipeline.harvest extract --captures "harvest/captures/$RUN_ID" --out "harvest/runs/$RUN_ID" \
            --prompts "harvest/prompts/$RUN_ID" --recordings "harvest/recordings/$RUN_ID" --run-id "$RUN_ID"
      - name: Open the review pull request
        if: env.ROUTE != 'none'
        run: python -m pipeline.queue open --run "harvest/runs/$RUN_ID" ${DRY_RUN:+--no-push}
      - name: Save harvest state
        if: env.ROUTE == 'api' || env.ROUTE == 'subscription'
        run: python -m pipeline.ops state push --run-id "$RUN_ID" --report "harvest/runs/$RUN_ID/run.json" --captures "harvest/captures/$RUN_ID"
      - name: Close the failure or waiting issue if one is open
        if: env.ROUTE != 'none'
        run: python -m pipeline.ops failure-issue --resolved --run-id "$RUN_ID" --run-url "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" ${DRY_RUN:+--dry-run}
      - name: Remind the maintainer of old review pull requests
        if: ${{ !cancelled() }}
        run: python -m pipeline.ops remind --maintainer "$MAINTAINER" --days 7 ${DRY_RUN:+--dry-run}
      - name: Summary
        if: always()
        run: |
          python - <<'PY' > harvest/summary.md
          import json, os
          rid = os.environ.get("RUN_ID", "?")
          print(f"## Harvest {rid}" + (" (dry run)" if os.environ.get("DRY_RUN") else ""))
          try:
              f = json.load(open(f"harvest/captures/{rid}/fetch-report.json"))
              print("### Fetch\n| source | listed | captured | skipped | document errors | errors |\n|---|---|---|---|---|---|")
              for s in f["sources"]:
                  print(f"| {s['source']} | {s['listed']} | {s['captured']} | {s['skipped']} | {s['document_errors']} | {'; '.join(s['errors'])[:80]} |")
          except FileNotFoundError:
              print("fetch report missing")
          try:
              x = json.load(open(f"harvest/prompts/{rid}/index.json"))
              print(f"### Prompts\n- written: {len(x['documents'])}\n- not about the South China Sea: {len(x['irrelevant'])}\n- deferred to the next run: {len(x['deferred'])}")
              if x["irrelevant"]:
                  print("\n<details><summary>Dropped as not about the sea (first 30; spot-check the filter)</summary>\n")
                  for d in x["irrelevant"][:30]:
                      print(f"- {d['source_id']}: [{d['title'] or d['url']}]({d['url']})")
                  print("\n</details>")
          except FileNotFoundError:
              pass
          try:
              r = json.load(open(f"harvest/runs/{rid}/run.json"))
              cost = f"${r['estimated_cost_usd']:.2f}" if r["estimated_cost_usd"] is not None else "unknown"
              print(f"### Extract\n- documents: {r['documents']}\n- candidates: {r['candidates']} (possible duplicates {r['duplicates']})")
              print(f"- tokens in/out: {r['input_tokens']}/{r['output_tokens']}; estimated cost: {cost}")
              print(f"- extractor: {r['extractor']}\n- failures: {len(r['failures'])} (deferred {r.get('deferred', 0)}); not about the sea: {r.get('irrelevant', 0)}\n\n| source | documents | candidates | failures |\n|---|---|---|---|")
              for sid, s in r["by_source"].items():
                  print(f"| {sid} | {s['documents']} | {s['candidates']} | {s['failures']} |")
          except FileNotFoundError:
              print("run report missing" if os.environ.get("ROUTE") != "none" else "no extraction: no credential (see the waiting issue)")
          PY
          cat harvest/summary.md >> "$GITHUB_STEP_SUMMARY"
      - name: Open or update the waiting issue (no credential to extract)
        if: env.ROUTE == 'none' && success()
        run: |
          python -m pipeline.ops failure-issue --kind waiting --run-id "$RUN_ID" \
            --run-url "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
            --detail "$(cat harvest/summary.md 2>/dev/null || echo 'no summary')"
      - name: Open or update the failure issue
        # not success(): a run cancelled by the 90-minute timeout is a failure too
        if: ${{ !success() }}
        run: |
          python -m pipeline.ops failure-issue --run-id "${RUN_ID:-$GITHUB_RUN_ID}" --status "${{ job.status }}" \
            --run-url "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
            --detail "$(cat harvest/summary.md 2>/dev/null || echo 'no summary')" ${DRY_RUN:+--dry-run}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: harvest-${{ env.RUN_ID }}
          path: |
            harvest/captures/${{ env.RUN_ID }}
            harvest/runs/${{ env.RUN_ID }}
            harvest/recordings/${{ env.RUN_ID }}
            harvest/prompts/${{ env.RUN_ID }}
            harvest/state.json
            harvest/summary.md
