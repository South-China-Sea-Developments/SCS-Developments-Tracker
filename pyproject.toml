[project]
name = "scs-developments-tracker"
version = "2.0.0.dev0"
description = "Pipeline, validator and site build for the SCS Developments Tracker (MATS continuation)"
requires-python = ">=3.11"
dependencies = ["openpyxl>=3.1", "jinja2>=3.1"]

[project.optional-dependencies]
dev = ["pytest>=8", "playwright>=1.45"]
llm = ["anthropic>=0.40"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["pipeline", "web"]

[tool.setuptools.package-data]
web = ["templates/*", "static/*", "static/fonts/*"]
pipeline = ["sources.json", "prompts/*"]
